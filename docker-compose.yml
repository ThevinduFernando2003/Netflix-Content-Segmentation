services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      ARTIFACT_DIR: /app/models
      PROJECT_ROOT: /app
      PYTHONPATH: /app/src
      CORS_ORIGINS: "*"
      RATE_LIMIT_PER_MINUTE: "120"
  ui:
    build: .
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.port
      - "8501"
      - --server.address
      - 0.0.0.0
      - --server.headless
      - "true"
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health")
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
